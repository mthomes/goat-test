name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ────────────────────────────────────────────────────────── static checks ──
  check:
    name: Lint, types, build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # Pinned to the local version. .nvmrc is the single source of truth
          # so CI and a developer's shell cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Stylelint
        run: npm run lint:css

      - name: No <style> blocks
        run: npm run lint:style-blocks

      - name: astro check
        run: npm run check

      # The build is where content-collection schema violations surface, and
      # they surface as a non-zero exit rather than a warning.
      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────── unit ──
  unit:
    name: Unit + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Vitest
        run: npm run test:unit:coverage

      - name: Coverage summary
        if: always()
        run: |
          {
            echo "## Coverage"
            echo
            if [ -f coverage/coverage-summary.json ]; then
              node -e '
                const t = require("./coverage/coverage-summary.json").total;
                console.log("| Metric | Covered | Total | % |");
                console.log("| ------ | ------: | ----: | -: |");
                for (const key of ["statements", "branches", "functions", "lines"]) {
                  const m = t[key];
                  console.log(`| ${key} | ${m.covered} | ${m.total} | **${m.pct}%** |`);
                }
              '
            else
              echo "_No coverage report produced._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ───────────────────────────────────────────────────────────── guardrails ──
  guardrails:
    name: Guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Builds first: every assertion in this suite reads dist/.
      - name: Zero-JS and cascade integrity
        run: npm run test:guardrails

  # ──────────────────────────────────────────────────────────────────── e2e ──
  e2e:
    name: E2E ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Browsers are ~400MB and unchanged between runs; keyed by the Playwright
      # version so a bump invalidates the cache rather than using stale binaries.
      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Install system deps
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium firefox webkit

      # E2E, a11y and contrast all live in this suite and shard together.
      - name: Playwright
        run: npm run test:e2e -- --shard=${{ matrix.shard }}/4 --reporter=blob

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 3

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-failures-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  e2e-report:
    name: E2E report
    runs-on: ubuntu-latest
    needs: [e2e]
    if: always()
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Merge shard reports
        run: npx playwright merge-reports --reporter=html,github ./all-blob-reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────── visual ──
  visual:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install system deps
        if: steps.browsers.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # Compares against the committed Linux baselines. macOS baselines are
      # committed too; Playwright picks by platform.
      - name: Screenshots
        run: npm run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report-visual/
          retention-days: 7

  # ─────────────────────────────────────────────────────────── traceability ──
  traceability:
    name: Requirement traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # --strict: any issue with acceptance criteria and no covering test fails
      # the build. This is the criterion that makes the testing epic
      # self-enforcing — everything upstream of it is optional discipline.
      - name: Trace requirements to tests
        run: npm run trace -- --strict
