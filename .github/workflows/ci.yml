name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: astro check + build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          # Pinned to the local version. .nvmrc is the single source of truth
          # so CI and a developer's shell cannot drift apart.
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint CSS
        run: npm run lint:css

      - name: Lint style blocks
        run: npm run lint:style-blocks

      - name: astro check
        run: npm run check

      # The build is where content-collection schema violations surface, and
      # they surface as a non-zero exit rather than a warning — a release with
      # a malformed version or an unknown change type stops the pipeline here.
      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Visual regression
        run: npm run test:visual

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: visual-diffs
          path: |
            test-results/
            playwright-report-visual/
          retention-days: 7

      - name: Guardrails
        run: npx vitest run --config vitest.guardrails.config.ts

      # Prints the issue -> covering tests table to the job summary. It is
      # non-blocking here; #51 turns it into a gate once the suite exists.
      - name: Requirement traceability
        if: always()
        run: npm run trace
